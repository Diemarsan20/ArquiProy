# ============================================================
# M3 — 10.43.100.76  |  SaludPay
# Servicios: saludpay-service
# Nota: sps-service se eliminó de M3 para evitar split-brain con H2 en memoria.
#       Solo M2 corre sps-service. Para escalar SPS se requiere BD compartida (ej. PostgreSQL).
# Prerequisito: M1 (RabbitMQ) ya debe estar corriendo
# ============================================================
services:

  saludpay-service:
    build: ./saludpay-service
    container_name: saludpay-service
    restart: unless-stopped
    ports:
      - "8082:8082"   # API SaludPay: http://10.43.100.76:8082
                      # Swagger UI: http://10.43.100.76:8082/swagger
    environment:
      RABBITMQ__HOST: 10.43.99.197      # M1
      RABBITMQ__PORT: "5672"
      RABBITMQ__USERNAME: adminclientes
      RABBITMQ__PASSWORD: adminclientes123
