# sps-lb — configuración multi-máquina (deployment distribuido)
# Usado por docker-compose.m2.yml
# M2 (10.43.100.192): instancia 1 de sps-service en puerto 8087
# M3 (10.43.100.76):  instancia 2 de sps-service en puerto 8080

upstream sps_backend {
    least_conn;
    server 10.43.100.192:8087;   # sps-service instancia 1 (M2)
    server 10.43.100.76:8080;    # sps-service instancia 2 (M3)
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass              http://sps_backend;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   5s;
        proxy_read_timeout      30s;
    }
}
