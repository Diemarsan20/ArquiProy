# Basado en 09-textos (1).txt — load balancer para sps-service
upstream sps_backend {
    least_conn;
    server sps-service:8080;
    # Al escalar con: docker-compose up --scale sps-service=N
    # Docker DNS resuelve "sps-service" a todas las instancias automáticamente
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://sps_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
