# ===============================
# = Connection Config (H2 - tomado de 05_textos_h2)
# ===============================
spring.application.name=sps-service
# In-memory permite múltiples instancias para escalabilidad (en prod se usaría PostgreSQL compartido)
spring.datasource.url=jdbc:h2:mem:spsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===============================
# = RabbitMQ Config (tomado de 08_textos_eda_f)
# ===============================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:adminclientes}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:adminclientes123}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=5

# ===============================
# = SNS URL (inyectado via Docker env)
# ===============================
sns.base-url=${SNS_BASE_URL:http://localhost:8081}

# ===============================
# = Mail (Mailhog SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

server.port=8080
