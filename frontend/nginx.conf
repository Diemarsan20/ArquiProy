server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy a SPS via load balancer (sps-lb)
    location /sps/ {
        proxy_pass         http://sps-lb:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Reverse proxy a SaludPay
    location /spay/ {
        proxy_pass         http://saludpay-service:8082/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Reverse proxy a SHC (para consultas opcionales)
    location /shc/ {
        proxy_pass         http://shc-service:8083/;
        proxy_set_header   Host $host;
    }

    # Reverse proxy a SAM (para consultas opcionales)
    location /sam/ {
        proxy_pass         http://sam-service:8084/;
        proxy_set_header   Host $host;
    }
}
